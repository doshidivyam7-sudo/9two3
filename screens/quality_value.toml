# Quality at a reasonable price.
# Filters are hard cut-offs; [rank] weights order the survivors
# (positive = higher is better, negative = lower is better).
# Metric names: see FIELDS in screener_memo/data.py.

name = "Quality at a reasonable price"
description = "Profitable, lowly geared compounders that are still growing and not priced for perfection."
top_n = 10
exclude_sectors = ["Financial Services"]   # ROE / D:E mean something else for lenders

[filters]
market_cap_cr      = { min = 2000 }
roe_pct            = { min = 15 }
debt_to_equity     = { max = 0.5, allow_missing = true }
pe                 = { min = 0, max = 45 }
revenue_growth_pct = { min = 8 }

[rank]
roe_pct            = 1.0
revenue_growth_pct = 1.0
earnings_growth_pct = 0.5
pe                 = -1.0
debt_to_equity     = -0.5

[memo]
mandate = "Long-only Indian listed equities, 3-5 year holding period, avoids governance risk and leveraged balance sheets."
